name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
    # Also the once-a-day lint of main; see the `lint` job. Keep this string
    # in sync with the job's `if:`.
    - cron: "37 7 * * *"
  workflow_dispatch:

concurrency:
  group: update-cask
  # Never cancel: a cancelled run can interrupt the commit/push and leaves a
  # run that is neither green nor red, which is exactly the state that hides
  # problems in the run list.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Check upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash -euo pipefail {0}
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      current: ${{ steps.check.outputs.current }}
      needs_update: ${{ steps.check.outputs.needs_update }}
      arm_asset: ${{ steps.check.outputs.arm_asset }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compare tap against upstream release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Pick the highest stable vX.Y.Z from the release list rather than
          # asking for /releases/latest: that pointer briefly 404s while
          # upstream is publishing, and it can point at a non-semver tag.
          # Capture stderr and the exit code by hand. A bare `VAR=$(cmd ...)`
          # under `set -e` aborts the step at the assignment, so the error
          # branches below never get to run and the log shows only "exit 1".
          if ! .github/scripts/retry .github/scripts/upstream-releases \
              > /tmp/releases.json 2>/tmp/gh.err; then
            echo "::error::Failed to list releases on RimSort/RimSort"
            cat /tmp/gh.err
            {
              echo "### :x: Could not reach the RimSort releases API (4 attempts)"
              echo
              echo '```'; cat /tmp/gh.err; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          RELEASE=$(jq -c '
            [.[] | select(.draft == false and .prerelease == false
                          and (.tag_name | test("^v?[0-9]+\\.[0-9]+\\.[0-9]+$")))]
            | sort_by(.tag_name | ltrimstr("v") | split(".") | map(tonumber))
            | last // empty' /tmp/releases.json)
          if [ -z "$RELEASE" ]; then
            echo "Release tags upstream returned:"; jq -r '.[].tag_name' /tmp/releases.json || cat /tmp/releases.json
            echo "::error::No stable vX.Y.Z release found on RimSort/RimSort"
            exit 1
          fi
          LATEST=$(jq -r '.tag_name' <<<"$RELEASE")
          LATEST_VERSION="${LATEST#v}"

          CURRENT=$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Casks/rimsort.rb | head -n 1)
          if [ -z "$CURRENT" ]; then
            echo "::error::Failed to parse current version from Casks/rimsort.rb"
            {
              echo "### :x: Could not parse the version stanza out of the cask"
              echo
              echo '```ruby'; cat Casks/rimsort.rb; echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_VERSION" = "$CURRENT" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $CURRENT"
            {
              echo "### :white_check_mark: Already up to date"
              echo
              echo "Tap and upstream are both at \`$CURRENT\`. Nothing to do."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Never move the cask backwards, e.g. if upstream deletes its
          # newest release to re-cut it.
          if [ "$(printf '%s\n' "$CURRENT" "$LATEST_VERSION" | sort -V | tail -n 1)" = "$CURRENT" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Upstream's newest stable release ($LATEST_VERSION) is older than the tap ($CURRENT); not downgrading"
            {
              echo "### :warning: Upstream is behind the tap"
              echo
              echo "Newest stable upstream release is \`$LATEST_VERSION\`, the tap has \`$CURRENT\`."
              echo "Not downgrading. If upstream pulled \`$CURRENT\` for good, edit the cask by hand."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ASSETS=$(jq -r '.assets[].name' <<<"$RELEASE")
          echo "Assets on $LATEST:"; echo "$ASSETS" | sed 's/^/  /'

          # Apple Silicon only: upstream stopped building Intel macOS in
          # v1.17.4 (RimSort/RimSort#2576). Match the arch loosely, since
          # upstream renamed it once already (Darwin_arm -> Darwin_arm64).
          # `|| true` keeps a non-matching grep from killing the step under
          # `set -e` before the diagnostic below can print.
          ARM_ASSET=$(echo "$ASSETS" | grep -E 'Darwin[_-]arm(64)?\.' | head -1 || true)

          if [ -z "$ARM_ASSET" ]; then
            # Upstream's build attaches assets after the release is published,
            # so a fresh release with no macOS assets is just not ready yet.
            PUBLISHED=$(jq -r '.published_at' <<<"$RELEASE")
            AGE_HOURS=$(( ($(date +%s) - $(date -d "$PUBLISHED" +%s)) / 3600 ))
            if [ "$AGE_HOURS" -lt 24 ]; then
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
              echo "::notice::$LATEST is ${AGE_HOURS}h old and has no macOS assets yet; waiting for the next run"
              {
                echo "### :hourglass: Waiting for \`$LATEST\` assets"
                echo
                echo "Published ${AGE_HOURS}h ago with no macOS assets attached yet. Will retry next run;"
                echo "this becomes a failure if they are still missing after 24h."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "::error::Could not find a Darwin arm64 asset for $LATEST"
            {
              echo "### :x: No macOS assets matched on \`$LATEST\`"
              echo
              echo "Published ${AGE_HOURS}h ago. Upstream probably renamed them again. Assets actually published:"
              echo
              echo '```'; echo "$ASSETS"; echo '```'
              echo
              echo "Pattern tried: \`Darwin[_-]arm(64)?\\.\`"
              echo "Widen it in \`.github/workflows/update-cask.yml\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "arm_asset=$ARM_ASSET" >> "$GITHUB_OUTPUT"
          echo "needs_update=true" >> "$GITHUB_OUTPUT"
          echo "New version available: $LATEST_VERSION (current: $CURRENT)"
          {
            echo "### :arrow_up: Update available"
            echo
            echo "| | version |"
            echo "|---|---|"
            echo "| tap | \`$CURRENT\` |"
            echo "| upstream | \`$LATEST_VERSION\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  update:
    # Dynamic job name so the run's job list says what actually happened.
    # (run-name: can't do this — it is evaluated before any job runs, so it
    # has no access to job outputs.)
    name: Bump ${{ needs.check.outputs.current }} → ${{ needs.check.outputs.latest }}
    needs: check
    if: needs.check.outputs.needs_update == 'true'
    # macOS so we can run the real Homebrew linters, which only exist here.
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Homebrew lint baseline (cask before the bump)
        run: |
          # Never fails: this only records what main already gets flagged for,
          # so the post-bump lint can tell new offenses from inherited ones.
          .github/scripts/lint-cask /tmp/lint-before.txt || true

      - name: Download and compute SHA256
        id: sha
        run: |
          VERSION="${{ needs.check.outputs.latest }}"
          TAG="v${VERSION}"
          ARM_ASSET="${{ needs.check.outputs.arm_asset }}"

          # Plain release-download URLs rather than `gh release download`:
          # they are what the cask itself fetches, and they do not depend on
          # the API letting the workflow token see upstream's releases.
          mkdir -p /tmp/rimsort
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors \
            -o "/tmp/rimsort/$ARM_ASSET" "https://github.com/RimSort/RimSort/releases/download/$TAG/$ARM_ASSET"

          # macOS runner: shasum, not sha256sum.
          SHA_ARM=$(shasum -a 256 "/tmp/rimsort/$ARM_ASSET" | awk '{print $1}')
          if ! echo "$SHA_ARM" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Computed SHA256 looks wrong: $SHA_ARM"
            exit 1
          fi

          # Carry the whole filename into the cask with the version put back as
          # #{version}, so a future arch or extension rename needs no change here.
          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "arm_file=$(echo "$ARM_ASSET" | sed "s/${VERSION}/#{version}/g")" >> "$GITHUB_OUTPUT"

      - name: Update cask
        run: |
          VERSION="${{ needs.check.outputs.latest }}"

          # Only the release-download url is rewritten, so the livecheck url
          # is left alone; the filename is replaced whole, so the cask's own
          # filename never has to be matched.
          awk -v ver="$VERSION" \
              -v arm_sha="${{ steps.sha.outputs.sha_arm }}" \
              -v arm_file="${{ steps.sha.outputs.arm_file }}" '
            /^[[:space:]]*sha256 "/ {
              sub(/sha256 "[^"]*"/, "sha256 \"" arm_sha "\"")
            }
            /^[[:space:]]*url "[^"]*\/releases\/download\// {
              sub(/[^\/"]+"[[:space:]]*$/, arm_file "\"")
            }
            /^[[:space:]]*version "/ {
              sub(/version "[^"]*"/, "version \"" ver "\"")
            }
            { print }
          ' Casks/rimsort.rb > Casks/rimsort.rb.tmp
          mv Casks/rimsort.rb.tmp Casks/rimsort.rb

          git diff --no-color Casks/rimsort.rb | tee /tmp/cask.diff

      - name: Validate cask
        id: validate
        run: |
          VERSION="${{ needs.check.outputs.latest }}"
          SHA_ARM="${{ steps.sha.outputs.sha_arm }}"

          fail() {
            echo "::error::$1"
            { echo "### :x: Validation failed"; echo; echo "$1"; echo
              echo '```ruby'; cat Casks/rimsort.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          ruby -c Casks/rimsort.rb > /dev/null || fail "Cask has invalid Ruby syntax"
          grep -qF "version \"${VERSION}\"" Casks/rimsort.rb || fail "Version ${VERSION} not found in updated cask"
          grep -qF "$SHA_ARM" Casks/rimsort.rb        || fail "SHA256 missing from updated cask"

          # Read the URL back out the same way the rewrite found it.
          ARM_URL=$(awk '
            /^[[:space:]]*url "[^"]*\/releases\/download\// {
              match($0, /https:\/\/[^"]+/); print substr($0, RSTART, RLENGTH); exit
            }
          ' Casks/rimsort.rb | sed "s/#{version}/${VERSION}/g")
          [ -n "$ARM_URL" ] || fail "Could not read the download URL back out of the cask"

          echo "Checking URL: $ARM_URL"
          curl --fail --silent --location --head --retry 4 --retry-all-errors "$ARM_URL" > /dev/null || fail "Download URL returned an error: $ARM_URL"

          echo "arm_url=$ARM_URL" >> "$GITHUB_OUTPUT"

      - name: Homebrew lint (offenses added by the bump)
        id: lint
        run: |
          if .github/scripts/lint-cask /tmp/lint-after.txt; then
            echo "Homebrew lint clean"
            echo "preexisting=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only block the bump on offenses the bump itself introduced.
          # Offenses already on main come from Homebrew changing its rules;
          # the `lint` job reports those, and holding back the release
          # would not fix them.
          comm -13 /tmp/lint-before.txt /tmp/lint-after.txt > /tmp/lint-new.txt
          grep '^unparsed:' /tmp/lint-after.txt >> /tmp/lint-new.txt || true

          if [ -s /tmp/lint-new.txt ]; then
            echo "::error::The bump introduced new Homebrew offenses"
            {
              echo "### :x: The bump introduced new Homebrew offenses"
              echo
              echo '```'; cat /tmp/lint-new.txt; echo '```'
              echo
              cat /tmp/lint-after.txt.details
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "::warning::Cask has offenses that were already on main; bumping anyway"
          echo "preexisting=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/rimsort.rb
          git commit -m "Update RimSort to ${{ needs.check.outputs.latest }}"
          # Rebase first in case a hand edit landed on main during the run.
          .github/scripts/retry bash -c 'git pull --rebase --quiet origin main && git push origin HEAD:main'

      - name: Summary
        if: success()
        run: |
          {
            echo "### :white_check_mark: Bumped to \`${{ needs.check.outputs.latest }}\`"
            echo
            echo "| arch | asset | sha256 |"
            echo "|---|---|---|"
            echo "| arm64 | \`${{ needs.check.outputs.arm_asset }}\` | \`${{ steps.sha.outputs.sha_arm }}\` |"
            echo
            if [ "${{ steps.lint.outputs.preexisting }}" = "true" ]; then
              echo "Download URL returned 200. :warning: \`brew style\` / \`brew audit\` still flag"
              echo "offenses that were already on main (see the \`lint\` job); the bump added none."
            else
              echo "Download URL returned 200, \`brew style\` and \`brew audit\` clean."
            fi
            echo
            echo "<details><summary>cask diff</summary>"
            echo
            echo '```diff'; cat /tmp/cask.diff; echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    # Lints what is on main once a day, not just when there is a bump, so a
    # Homebrew rule change shows up within a day instead of on the next
    # RimSort release, and as its own failure rather than a broken bump.
    # Daily rather than every run: macOS runners are capacity-constrained,
    # and a job GitHub never finds a runner for turns the run red too.
    name: Lint published cask
    if: github.event_name != 'schedule' || github.event.schedule == '37 7 * * *'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash -euo pipefail {0}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Homebrew lint of the published cask (Homebrew rule change?)
        run: |
          if .github/scripts/lint-cask /tmp/lint.txt; then
            echo "### :white_check_mark: Published cask passes Homebrew lint" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "::error::Homebrew now rejects the cask on main"
          {
            echo "### :x: Homebrew now rejects the cask on main"
            echo
            echo "Nothing in this tap changed to cause this; Homebrew changed its rules."
            echo "Version bumps keep shipping while this is open, as long as they add"
            echo "no offenses of their own. Fix the cask by hand."
            echo
            echo '```'; cat /tmp/lint.txt; echo '```'
            echo
            cat /tmp/lint.txt.details
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

  notify:
    name: File failure issue
    needs: [check, update, lint]
    if: ${{ always() && (needs.check.result == 'failure' || needs.update.result == 'failure' || needs.lint.result == 'failure') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          LABEL="ci-failure"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          gh label create "$LABEL" --color B60205 \
            --description "Update Cask pipeline is failing" 2>/dev/null || true

          # The Actions token's API reads sometimes come back empty rather
          # than failing, so a read that finds nothing gets a second look
          # before it is believed.
          read_twice() {
            local out
            out=$("$@" 2>/dev/null || true)
            if [ -z "$out" ]; then
              sleep 20
              out=$("$@" 2>/dev/null || true)
            fi
            printf '%s' "$out"
          }

          # Name the step that actually broke, so the issue title is the diagnosis.
          FAILED=$(read_twice gh run view "${{ github.run_id }}" --json jobs \
            --jq '[.jobs[].steps[] | select(.conclusion=="failure") | .name] | first // empty')
          FAILED="${FAILED:-unknown step}"

          TITLE="Update Cask failing at: ${FAILED}"

          # Write the body to a file rather than BODY=$(cat <<EOF ...).
          # bash 3.2 mis-parses a heredoc inside command substitution as soon as
          # the text contains an apostrophe, and macOS runners still ship 3.2.
          cat > /tmp/issue-body.md <<EOF
          The scheduled \`Update Cask\` run is failing.

          | | |
          |---|---|
          | failing step | \`${FAILED}\` |
          | tap version | \`${{ needs.check.outputs.current || 'unknown' }}\` |
          | upstream version | \`${{ needs.check.outputs.latest || 'unknown' }}\` |
          | run | ${RUN_URL} |

          The job summary at the top of the run page states the cause; the raw
          logs are only needed for detail.

          This issue closes itself when a run succeeds again.
          EOF

          OPEN=$(read_twice gh issue list --label "$LABEL" --state open --json number,title --jq '.[0] // empty')
          NUM=$(jq -r '.number // empty' <<<"${OPEN:-null}")
          OLD_TITLE=$(jq -r '.title // empty' <<<"${OPEN:-null}")

          if [ -z "$NUM" ]; then
            gh issue create --title "$TITLE" --label "$LABEL" --body-file /tmp/issue-body.md
            echo "Filed a new issue."
          else
            if [ "$OLD_TITLE" != "$TITLE" ]; then
              # Different step broke than last time — worth saying so.
              gh issue comment "$NUM" --body "Now failing at a different step: \`${FAILED}\` — ${RUN_URL}"
              echo "Commented on #$NUM (failure mode changed)."
            else
              echo "Issue #$NUM already open for this failure; not duplicating."
            fi
          fi

  resolve:
    name: Close failure issue
    needs: [check, update, lint]
    if: ${{ always() && needs.check.result == 'success' && needs.update.result != 'failure' && needs.update.result != 'cancelled' && needs.lint.result != 'failure' && needs.lint.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Close any open failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINT_RESULT: ${{ needs.lint.result }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Close every open one, not just the newest: a duplicate can slip
          # in when an API read in the notify job comes back empty.
          OPEN=$(gh issue list --label ci-failure --state open --json number,title \
            --jq '.[] | "\(.number)\t\(.title)"')
          if [ -z "$OPEN" ]; then
            echo "No open failure issue; nothing to close."
            exit 0
          fi
          while IFS=$'\t' read -r NUM TITLE; do
            # Lint only runs once a day; a run that skipped it has not shown
            # that a lint failure is fixed.
            if [ "$LINT_RESULT" = "skipped" ] && [[ "$TITLE" == *"published cask"* ]]; then
              echo "#$NUM is a lint failure and this run did not lint; leaving it open."
            else
              gh issue close "$NUM" --comment "Recovered — the pipeline is green again as of ${RUN_URL}"
              echo "Closed #$NUM."
            fi
          done <<<"$OPEN"

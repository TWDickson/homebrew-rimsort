name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

concurrency:
  group: update-cask
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash -euo pipefail {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check for new RimSort release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --repo RimSort/RimSort --json tagName --jq '.tagName' 2>/dev/null)
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to fetch latest release tag from RimSort/RimSort"
            exit 1
          fi
          LATEST_VERSION="${LATEST#v}"

          CURRENT=$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Casks/rimsort.rb | head -n 1)
          if [ -z "$CURRENT" ]; then
            echo "::error::Failed to parse current version from Casks/rimsort.rb"
            exit 1
          fi

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_VERSION" != "$CURRENT" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "New version available: $LATEST_VERSION (current: $CURRENT)"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $CURRENT"
          fi

      - name: Download and compute SHA256
        if: steps.check.outputs.needs_update == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          TAG="v${VERSION}"

          ASSETS=$(gh release view "$TAG" --repo RimSort/RimSort --json assets --jq '.assets[].name')

          # Match the arch loosely: upstream renamed these in v1.12.0
          # (Darwin_arm -> Darwin_arm64, Darwin_i386 -> Darwin_x86_64).
          # `|| true` keeps a non-matching grep from killing the step under `set -e`,
          # so the diagnostic below actually gets a chance to print.
          ARM_ASSET=$(echo "$ASSETS" | grep -E 'Darwin[_-]arm(64)?\.' | head -1 || true)
          INTEL_ASSET=$(echo "$ASSETS" | grep -E 'Darwin[_-](i386|x86_64|amd64)\.' | head -1 || true)

          if [ -z "$ARM_ASSET" ] || [ -z "$INTEL_ASSET" ]; then
            echo "::error::Could not find Darwin assets for $TAG. Available assets:"
            echo "$ASSETS"
            exit 1
          fi

          echo "Found assets: $ARM_ASSET, $INTEL_ASSET"

          gh release download "$TAG" --repo RimSort/RimSort \
            --pattern "$ARM_ASSET" \
            --pattern "$INTEL_ASSET" \
            --dir /tmp/rimsort

          SHA_ARM=$(sha256sum "/tmp/rimsort/$ARM_ASSET" | awk '{print $1}')
          SHA_INTEL=$(sha256sum "/tmp/rimsort/$INTEL_ASSET" | awk '{print $1}')

          # Sanity-check: SHA256 must be exactly 64 hex chars
          if ! echo "$SHA_ARM" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Computed ARM SHA256 looks wrong: $SHA_ARM"
            exit 1
          fi
          if ! echo "$SHA_INTEL" | grep -qE '^[a-f0-9]{64}$'; then
            echo "::error::Computed Intel SHA256 looks wrong: $SHA_INTEL"
            exit 1
          fi

          # Carry the whole filename into the cask, with the version put back as
          # #{version}. Writing the filename wholesale means a future arch or
          # extension rename needs no workflow change.
          ARM_FILE=$(echo "$ARM_ASSET" | sed "s/${VERSION}/#{version}/g")
          INTEL_FILE=$(echo "$INTEL_ASSET" | sed "s/${VERSION}/#{version}/g")

          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "sha_intel=$SHA_INTEL" >> "$GITHUB_OUTPUT"
          echo "arm_file=$ARM_FILE" >> "$GITHUB_OUTPUT"
          echo "intel_file=$INTEL_FILE" >> "$GITHUB_OUTPUT"

      - name: Update cask
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          SHA_ARM="${{ steps.sha.outputs.sha_arm }}"
          SHA_INTEL="${{ steps.sha.outputs.sha_intel }}"
          ARM_FILE="${{ steps.sha.outputs.arm_file }}"
          INTEL_FILE="${{ steps.sha.outputs.intel_file }}"

          # Rewrite by block (on_arm / on_intel) rather than by arch token or by
          # "first sha256 / second sha256" position, so the cask's own filenames
          # never have to be matched.
          awk -v ver="$VERSION" \
              -v arm_sha="$SHA_ARM" -v intel_sha="$SHA_INTEL" \
              -v arm_file="$ARM_FILE" -v intel_file="$INTEL_FILE" '
            /^[[:space:]]*on_arm do/        { block = "arm" }
            /^[[:space:]]*on_intel do/      { block = "intel" }
            /^[[:space:]]*end[[:space:]]*$/ { block = "" }

            block != "" && /sha256 "/ {
              sub(/sha256 "[^"]*"/, "sha256 \"" (block == "arm" ? arm_sha : intel_sha) "\"")
            }
            block != "" && /url "/ {
              sub(/[^\/"]+"[[:space:]]*$/, (block == "arm" ? arm_file : intel_file) "\"")
            }
            /^[[:space:]]*version "/ {
              sub(/version "[^"]*"/, "version \"" ver "\"")
            }
            { print }
          ' Casks/rimsort.rb > Casks/rimsort.rb.tmp
          mv Casks/rimsort.rb.tmp Casks/rimsort.rb

          echo "Updated cask:"
          cat Casks/rimsort.rb

      - name: Validate cask
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          SHA_ARM="${{ steps.sha.outputs.sha_arm }}"
          SHA_INTEL="${{ steps.sha.outputs.sha_intel }}"

          # Ruby syntax check
          ruby -c Casks/rimsort.rb || { echo "::error::Cask has invalid Ruby syntax"; exit 1; }

          # Verify version was written correctly
          if ! grep -qF "version \"${VERSION}\"" Casks/rimsort.rb; then
            echo "::error::Version ${VERSION} not found in updated cask"
            cat Casks/rimsort.rb
            exit 1
          fi

          # Verify both SHA256s are present
          if ! grep -qF "$SHA_ARM" Casks/rimsort.rb; then
            echo "::error::ARM SHA256 missing from updated cask"
            cat Casks/rimsort.rb
            exit 1
          fi
          if ! grep -qF "$SHA_INTEL" Casks/rimsort.rb; then
            echo "::error::Intel SHA256 missing from updated cask"
            cat Casks/rimsort.rb
            exit 1
          fi

          # Verify the download URLs actually respond (catches deleted releases,
          # wrong filenames, etc.). Read them per-block, same as the update step.
          extract_url() {
            awk -v want="$1" '
              /^[[:space:]]*on_arm do/        { block = "arm" }
              /^[[:space:]]*on_intel do/      { block = "intel" }
              /^[[:space:]]*end[[:space:]]*$/ { block = "" }
              block == want && /url "/ {
                match($0, /https:\/\/[^"]+/)
                print substr($0, RSTART, RLENGTH)
                exit
              }
            ' Casks/rimsort.rb | sed "s/#{version}/${VERSION}/g"
          }

          ARM_URL=$(extract_url arm)
          INTEL_URL=$(extract_url intel)

          if [ -z "$ARM_URL" ] || [ -z "$INTEL_URL" ]; then
            echo "::error::Could not read download URLs back out of the cask"
            cat Casks/rimsort.rb
            exit 1
          fi

          echo "Checking ARM URL:   $ARM_URL"
          curl --fail --silent --location --head "$ARM_URL" > /dev/null \
            || { echo "::error::ARM download URL returned an error: $ARM_URL"; exit 1; }

          echo "Checking Intel URL: $INTEL_URL"
          curl --fail --silent --location --head "$INTEL_URL" > /dev/null \
            || { echo "::error::Intel download URL returned an error: $INTEL_URL"; exit 1; }

          echo "Validation passed — cask looks good"

      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/rimsort.rb
          git commit -m "Update RimSort to ${{ steps.check.outputs.latest }}"
          git push

name: Update Cask

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for new RimSort release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST=$(gh release view --repo RimSort/RimSort --json tagName --jq '.tagName' 2>/dev/null)
          if [ -z "$LATEST" ]; then
            echo "Failed to fetch latest release tag from RimSort/RimSort" >&2
            exit 1
          fi
          LATEST_VERSION="${LATEST#v}"

          CURRENT=$(sed -n 's/^[[:space:]]*version "\([^"]*\)".*/\1/p' Casks/rimsort.rb | head -n 1)
          if [ -z "$CURRENT" ]; then
            echo "Failed to parse current version from Casks/rimsort.rb" >&2
            exit 1
          fi

          echo "latest=$LATEST_VERSION" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_VERSION" != "$CURRENT" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "New version available: $LATEST_VERSION (current: $CURRENT)"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: $CURRENT"
          fi

      - name: Download and compute SHA256
        if: steps.check.outputs.needs_update == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          TAG="v${VERSION}"

          # Auto-detect Darwin asset filenames (handles .zip, .tar.gz, etc.)
          ASSETS=$(gh release view "$TAG" --repo RimSort/RimSort --json assets --jq '.assets[].name')

          ARM_ASSET=$(echo "$ASSETS" | grep "Darwin_arm\." | head -1)
          INTEL_ASSET=$(echo "$ASSETS" | grep "Darwin_i386\." | head -1)

          if [ -z "$ARM_ASSET" ] || [ -z "$INTEL_ASSET" ]; then
            echo "Could not find Darwin assets for $TAG" >&2
            echo "Available assets:" >&2
            echo "$ASSETS" >&2
            exit 1
          fi

          # Extract the portion after "Darwin_arm." / "Darwin_i386." as the extension
          ARM_EXT="${ARM_ASSET#*Darwin_arm.}"
          INTEL_EXT="${INTEL_ASSET#*Darwin_i386.}"

          gh release download "$TAG" --repo RimSort/RimSort \
            --pattern "$ARM_ASSET" \
            --pattern "$INTEL_ASSET" \
            --dir /tmp/rimsort

          SHA_ARM=$(sha256sum "/tmp/rimsort/$ARM_ASSET" | awk '{print $1}')
          SHA_INTEL=$(sha256sum "/tmp/rimsort/$INTEL_ASSET" | awk '{print $1}')

          echo "sha_arm=$SHA_ARM" >> "$GITHUB_OUTPUT"
          echo "sha_intel=$SHA_INTEL" >> "$GITHUB_OUTPUT"
          echo "arm_ext=$ARM_EXT" >> "$GITHUB_OUTPUT"
          echo "intel_ext=$INTEL_EXT" >> "$GITHUB_OUTPUT"

      - name: Update cask
        if: steps.check.outputs.needs_update == 'true'
        run: |
          VERSION="${{ steps.check.outputs.latest }}"
          SHA_ARM="${{ steps.sha.outputs.sha_arm }}"
          SHA_INTEL="${{ steps.sha.outputs.sha_intel }}"
          ARM_EXT="${{ steps.sha.outputs.arm_ext }}"
          INTEL_EXT="${{ steps.sha.outputs.intel_ext }}"

          # Update version
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/rimsort.rb

          # Update URL extensions (handles any format change, e.g. zip -> tar.gz)
          sed -i "s|Darwin_arm\.[^\"]*\"|Darwin_arm.${ARM_EXT}\"|" Casks/rimsort.rb
          sed -i "s|Darwin_i386\.[^\"]*\"|Darwin_i386.${INTEL_EXT}\"|" Casks/rimsort.rb

          # Update ARM SHA (first sha256)
          sed -i "0,/sha256 \"[a-f0-9]\{64\}\"/s/sha256 \"[a-f0-9]\{64\}\"/sha256 \"${SHA_ARM}\"/" Casks/rimsort.rb

          # Update Intel SHA (second sha256)
          awk -v new="$SHA_INTEL" '
            /sha256 "[a-f0-9]{64}"/ { count++ }
            count == 2 && /sha256/ { sub(/sha256 "[a-f0-9]{64}"/, "sha256 \"" new "\""); count++ }
            { print }
          ' Casks/rimsort.rb > Casks/rimsort.rb.tmp
          mv Casks/rimsort.rb.tmp Casks/rimsort.rb

      - name: Commit and push
        if: steps.check.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/rimsort.rb
          git commit -m "Update RimSort to ${{ steps.check.outputs.latest }}"
          git push
